[project]
name = "advent-of-code"
version = "0.1.0"
description = ""
authors = [{ name = "Maxime Froment", email = "mfroment99@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "advent-of-code-data",
    "cookiecutter",
    "indexed",
    "networkx",
    "numpy",
    "sympy",
    "z3-solver",
]

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
bypass-selection = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
norecursedirs = ["_init", ".venv", "input"]

[tool.ruff]
line-length = 120
# cookiecutter templates are Jinja, not parseable Python
exclude = ["_init"]

[tool.ruff.lint.per-file-ignores]
# tests deliberately star-import the day module under test
"y_*/tests/test_*.py" = ["F403", "F405"]
